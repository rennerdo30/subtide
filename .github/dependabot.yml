# Dependabot configuration.
#
# Every version update across all ecosystems lands in ONE pull request per
# week (a multi-ecosystem group), so the review queue never holds more than
# one dependency PR. A short cooldown skips releases that are only hours old.
# Security updates are not delayed and arrive as soon as an advisory matches.
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "npm"
    directory: "/docs"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "pip"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker-compose"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3
